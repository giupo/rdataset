stages:
  - install_deps
  - build
  - test
  - coverage
  - deploy

.default_matrix: &r_matrix
  parallel:
    matrix:
      - ENV_LABEL: "R-default"
        R_BIN: "R"
        R_LIBS_USER: "/home/group/public/894cf/.R/4.2.0/library"
        RSCRIPT_BIN: "Rscript"
      
      - ENV_LABEL: "R-4.4.2"
        R_BIN: "R-4.4.2"
        R_LIBS_USER: "/home/group/public/894cf/.R/4.4.2/library"
        RSCRIPT_BIN: "Rscript-4.4.2"


      - ENV_LABEL: "R-4.5.0"
        R_BIN: "R-4.5.0"
        R_LIBS_USER: "/home/group/public/894cf/.R/4.5.0/library:/home/opt/R/lib64/R/library"
        RSCRIPT_BIN: "/home/group/public/894cf/cellar/R/4.5.0/bin/Rscript"

  variables:
      GIT_CLONE_PATH: "$CI_BUILDS_DIR/$CI_PIPELINE_ID/$ENV_LABEL"

  before_script:
    - |
      mkdir -p ${R_LIBS_USER}
      echo "ENV_LABEL: ${ENV_LABEL}"
      echo "R_BIN: ${R_BIN}"
      echo "RSCRIPT_BIN: ${RSCRIPT_BIN}"
      echo "R_LIBS_USER: ${R_LIBS_USER}"
      echo "GIT_CLONE_PATH: ${GIT_CLONE_PATH}"
      echo " ------- ENV --------"
      echo "PATH: ${PATH}"
  after_script:
    - | 
      echo "Cleaning up $GIT_CLONE_PATH"
      rm -rf "$GIT_CLONE_PATH"

install_deps:
  extends: .default_matrix
  stage: install_deps
  script:
    - $RSCRIPT_BIN $cfin/utils/setup.r

build:
  extends: .default_matrix
  stage: build
  script:
    - make check

test:
  extends: .default_matrix
  stage: test
  script:
    - make test

coverage:
  extends: .default_matrix
  stage: coverage
  script:
    - make coverage
  coverage: '/Coverage: \d+.\d+%/'
  allow_failure: true

deploy:
  extends: .default_matrix
  stage: deploy
  only:
    - tags
  script:
    - make install

